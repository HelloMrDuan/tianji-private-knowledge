name: Verify Dayun research with real private Canonical
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/dayun-jie-real-acceptance.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dayun-real-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Verify private destination
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REPOSITORY" = "HelloMrDuan/tianji-private-knowledge"
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')" = "true"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: HelloMrDuan/tianji-knowledge-base
          ref: c57451d2b05e1d94b9d1ecbad685046396f4cbca
          path: public-code
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate private runner guards
        run: python -m unittest discover -s tests -p 'test_accept_product_pr.py' -v
      - name: Install pinned runtime
        run: python -m pip install -e "./public-code[validation,calendar,api]"
      - name: Verify original private knowledge and complete Python regression
        run: |
          python scripts/accept_product_pr.py \
            --public-code "$GITHUB_WORKSPACE/public-code" \
            --expected-sha "c57451d2b05e1d94b9d1ecbad685046396f4cbca" \
            --suite all
