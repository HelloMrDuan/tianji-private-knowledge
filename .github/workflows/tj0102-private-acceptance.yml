name: TJ-010.2 Private Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - "tests/tj0102/test_tj0102_private_acceptance.py"
      - ".github/workflows/tj0102-private-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify private repository identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REPOSITORY" = "HelloMrDuan/tianji-private-knowledge"
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')" = "true"
      - name: Checkout private audit code and sealed knowledge
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: private
      - name: Checkout exact public PR #259 code
        uses: actions/checkout@v4
        with:
          repository: HelloMrDuan/tianji-knowledge-base
          ref: d7a5a3e060e4c3c507bd5c693d3c914c18d378d0
          path: public
          persist-credentials: false
      - name: Assert exact public PR head checked out
        run: test "$(git -C public rev-parse HEAD)" = "d7a5a3e060e4c3c507bd5c693d3c914c18d378d0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned application validation and calendar runtime
        run: python -m pip install -e "./public[validation,calendar,api]"
      - name: Verify 235 sealed assets and build isolated private backend
        run: |
          python - <<'PY'
          import importlib.util, os, shutil, sys
          from pathlib import Path
          root = Path.cwd()
          assert not (root / "public/data").exists(), "Private Canonical must not be in public checkout"
          spec = importlib.util.spec_from_file_location("private_importer", root / "private/scripts/import_public_snapshot.py")
          importer = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(importer)
          manifest = importer.verify(root / "private")
          assert manifest["file_count"] == 235
          sys.path.insert(0, str(root / "public"))
          from scripts.private_data_snapshot import verify_private_data
          from scripts.assemble_private_backend import assemble_private_backend
          temp = Path(os.environ["RUNNER_TEMP"])
          snapshot = temp / "tj0102-private-snapshot"
          snapshot.mkdir(mode=0o700)
          shutil.copytree(root / "private/data", snapshot / "data", symlinks=False)
          shutil.copy2(root / "private/private-data-manifest.json", snapshot / "private-data-manifest.json")
          checked = verify_private_data(snapshot)
          assert checked["file_count"] == manifest["file_count"]
          output = temp / "tj0102-private-runtime"
          result = assemble_private_backend(root / "public", snapshot, output)
          assert result["knowledge_files"] == 235
          print("Verified 235 sealed knowledge files and assembled actual private runtime")
          PY
      - name: Build actual private reviewed production catalog
        run: |
          cd "$RUNNER_TEMP/tj0102-private-runtime"
          PYTHONPATH=src python scripts/build_production_runtime.py
      - name: Rebuild product coverage (fix stale hashes)
        run: |
          cd "$RUNNER_TEMP/tj0102-private-runtime"
          PYTHONPATH=src python scripts/build_product_coverage.py
          echo "Product coverage rebuilt"
      - name: Run both 4 baseline and 16 expanded real chart scenarios
        run: |
          cd "$RUNNER_TEMP/tj0102-private-runtime"
          PYTHONPATH=src python - <<'PY'
          import os, runpy, traceback
          from pathlib import Path
          folder = Path(os.environ["GITHUB_WORKSPACE"]) / "private/tests/tj0102"
          failure_names = []
          total = 0
          for filename, exact_count in (
              ("test_tj0102_private_acceptance.py", 4),
              ("test_tj0102_expanded.py", 16),
          ):
              module = runpy.run_path(str(folder / filename))
              cases = sorted((key, func) for key, func in module.items()
                             if key.startswith("test_") and callable(func))
              assert len(cases) == exact_count, (
                  f"{filename}: expected {exact_count} real tests, found {len(cases)}")
              for name, func in cases:
                  total += 1
                  try:
                      func()
                      print("PASS", filename, name)
                  except Exception:
                      print("FAIL", filename, name)
                      traceback.print_exc()
                      failure_names.append(filename + ":" + name)
          print(f"TJ-010.2 private real chart scenarios: {total - len(failure_names)}/{total}")
          if failure_names:
              raise SystemExit("Failed tests: " + ", ".join(failure_names))
          assert total == 20
          PY
      - name: Run actual Evidence binding and fail-closed tests
        run: |
          cd "$RUNNER_TEMP/tj0102-private-runtime"
          PYTHONPATH=src python - <<'PY'
          import os, runpy, traceback
          from pathlib import Path
          source = Path(os.environ["GITHUB_WORKSPACE"]) / "private/tests/tj0102/test_tj0102_evidence.py"
          tests = runpy.run_path(str(source))
          cases = sorted((k,v) for k,v in tests.items() if k.startswith("test_") and callable(v))
          assert len(cases) == 11, f"Expected 11 evidence tests, got {len(cases)}"
          failures = []
          for name, func in cases:
              try:
                  func()
                  print("PASS evidence", name)
              except Exception:
                  print("FAIL evidence", name)
                  traceback.print_exc()
                  failures.append(name)
          print(f"TJ-010.2 Evidence test results: {len(cases)-len(failures)}/{len(cases)}")
          if failures: raise SystemExit("Failed Evidence cases: " + ", ".join(failures))
          PY
      - name: Run 5 real Evidence tampering negative tests (fail on missed rejection)
        run: |
          cd "$RUNNER_TEMP/tj0102-private-runtime"
          PYTHONPATH=src python - <<'PY'
          import os, runpy, traceback
          from pathlib import Path
          path = Path(os.environ["GITHUB_WORKSPACE"]) / "private/tests/tj0102/test_tj0102_negative.py"
          mod = runpy.run_path(str(path))
          cases = sorted((k, v) for k, v in mod.items()
                         if k.startswith("test_neg") and callable(v))
          assert len(cases) == 8, f"Expected eight tampering tests, found {len(cases)}"
          fails = []
          for name, fn in cases:
              try:
                  fn()
                  print("PASS negative", name)
              except Exception:
                  print("FAIL negative", name)
                  traceback.print_exc()
                  fails.append(name)
          print(f"Evidence negative tests: {len(cases) - len(fails)}/{len(cases)}")
          if fails:
              raise SystemExit("Negative tests failed: " + ", ".join(fails))
          PY
      - name: Run actual reviewed Bazi Phase2 regression
        run: |
          cd "$RUNNER_TEMP/tj0102-private-runtime"
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_phase2_bazi*.py' -v
      - name: Run sealed Bazi Phase2 Golden cases
        run: |
          cd "$RUNNER_TEMP/tj0102-private-runtime"
          PYTHONPATH=src python - <<'PY'
          from pathlib import Path
          from tianji_kb.golden import run_cases
          rows = run_cases(Path.cwd(), 'bazi')
          assert len(rows) > 0, "Golden dataset missing or empty"
          for row in rows:
              assert row["passed"] is True
          print("Actual Bazi Golden passed:", len(rows))
          PY
