name: TJ-010.2 Private Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - "tests/tj0102/test_tj0102_private_acceptance.py"
      - ".github/workflows/tj0102-private-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: private
      - name: Checkout public PR #259 head (pinned)
        uses: actions/checkout@v4
        with:
          repository: HelloMrDuan/tianji-knowledge-base
          ref: 024c4198d7b6da9adbce5d3a200736ff03f2ce5c
          path: public
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e './public[validation,calendar]'
      - name: Setup test environment
        run: |
          # Copy public src into private repo structure so resolver finds Canonical data
          # private/ has data/canonical, we add public src/tianji_kb there
          mkdir -p private/src
          cp -r public/src/tianji_kb private/src/
          # Copy test file
          cp private/tests/tj0102/test_tj0102_private_acceptance.py /tmp/test_private.py
          ls private/src/tianji_kb/bazi_action_matrix.py
      - name: Run TJ-010.2 private acceptance tests
        working-directory: private
        run: |
          python - <<'PY'
          import runpy
          import traceback
          mod = runpy.run_path('/tmp/test_private.py')
          cases = sorted((n, f) for n, f in mod.items()
                         if n.startswith('test_') and callable(f))
          assert len(cases) >= 4, f"Expected 4+ tests, got {len(cases)}"
          passed = 0
          failed = []
          for name, fn in cases:
              try:
                  fn()
                  print("PASS", name)
                  passed += 1
              except Exception as e:
                  print("FAIL", name, ":", e)
                  traceback.print_exc()
                  failed.append(name)
          print(f"TJ-010.2 private: {passed}/{len(cases)} passed")
          if failed:
              raise SystemExit(f"Failed: {failed}")
          PY
