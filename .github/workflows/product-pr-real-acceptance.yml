name: Validate product PRs against private knowledge

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/accept_product_pr.py"
      - "tests/test_accept_product_pr.py"
      - ".github/workflows/product-pr-real-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-product-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: career
            sha: f50a0d6f8d40d8e06d9ce8feba79f7c26667398e
          - suite: romance
            sha: 7bbc1e08ae518fa546ccc76e393c49fc1f5fe0bf
          - suite: periods
            sha: 3012006885cd2df7f61135a816f595cd14c1aeaa
          - suite: question
            sha: 05b0aae41f0835034c7be2b680f066f7f87d5644
          # Complete private Canonical + full regression for the public dream UX PR.
          - suite: all
            sha: f894f249eea3d56ddf3fad6a2b050468bb4131a2
          # PR #194: career selected-year interpretation, full real-private regression.
          - suite: all
            sha: 26d5de092bb66925bac4b254dec9c53253d5893a
          - suite: all
            sha: 884e2709561be5df24450c820f79eb6a60914468
          - suite: all
            sha: 8005baca91ee4c8c9fba2f74f5110d0c0d679292
          # PR #198: exact candidate, private Canonical full regression.
          - suite: all
            sha: bad7b8aff00ac143a8cb590554d445abb26c79d1
    steps:
      - name: Verify owner private repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REPOSITORY" = "HelloMrDuan/tianji-private-knowledge"
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')" = "true"

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: HelloMrDuan/tianji-knowledge-base
          ref: ${{ matrix.sha }}
          path: public-code
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate private acceptance runner guards
        run: python -m unittest discover -s tests -p 'test_accept_product_pr.py' -v

      - name: Install actual pinned code dependencies
        run: python -m pip install -e "./public-code[validation,calendar,api]"

      - name: Audit original data, derive temporary coverage and run real cases
        run: |
          python scripts/accept_product_pr.py \
            --public-code "$GITHUB_WORKSPACE/public-code" \
            --expected-sha "${{ matrix.sha }}" \
            --suite "${{ matrix.suite }}"


  career-live-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Confirm private destination
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REPOSITORY" = "HelloMrDuan/tianji-private-knowledge"
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')" = "true"

      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: HelloMrDuan/tianji-knowledge-base
          ref: 26d5de092bb66925bac4b254dec9c53253d5893a
          path: public-code
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: public-code/web/visual-prototype/package-lock.json

      - name: Assemble verified private-data API
        run: |
          python - <<'PY'
          import os, shutil, sys, importlib.util
          from pathlib import Path
          root = Path.cwd()
          spec = importlib.util.spec_from_file_location("importer", "scripts/import_public_snapshot.py")
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          inventory = mod.verify(root)
          code = root / "public-code"
          sys.path.insert(0, str(code))
          from scripts.assemble_private_backend import assemble_private_backend
          temp = Path(os.environ["RUNNER_TEMP"])
          snapshot = temp / "career-private-snapshot"
          snapshot.mkdir()
          shutil.copytree(root / "data", snapshot / "data")
          shutil.copy2(root / "private-data-manifest.json", snapshot / "private-data-manifest.json")
          assembled = temp / "career-private-backend"
          result = assemble_private_backend(code, snapshot, assembled)
          assert result["knowledge_files"] == inventory["file_count"]
          print("Private Canonical integrity verified:", inventory["file_count"])
          PY

      - name: Install real backend, frontend and browser
        run: |
          python -m pip install -e "./public-code[validation,calendar,api]"
          (cd "$RUNNER_TEMP/career-private-backend" && PYTHONPATH=src python scripts/build_production_runtime.py)
          cd public-code/web/visual-prototype
          npm ci
          npx playwright install --with-deps chromium
          npm run build

      - name: Browser test against live private API
        shell: bash
        run: |
          set -euo pipefail
          (
            cd "$RUNNER_TEMP/career-private-backend"
            PYTHONPATH=src uvicorn tianji_kb.api:app --host 127.0.0.1 --port 8000 >"$RUNNER_TEMP/career-api.log" 2>&1
          ) &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health
          cd public-code/web/visual-prototype
          CI=true npm test -- tests/career-annual-reading.spec.ts

