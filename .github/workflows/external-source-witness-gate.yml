name: Authenticate Dream and Dayun external witness notes
on:
  pull_request:
    branches: [main]
    paths:
      - "private-reviews/dream_external_witnesses_v1.json"
      - "private-reviews/dayun_external_witnesses_v1.json"
      - "scripts/verify_external_source_witnesses.py"
      - "tests/test_external_source_witnesses.py"
      - ".github/workflows/external-source-witness-gate.yml"
permissions:
  contents: read
jobs:
  source-witness-private-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Assert owner private repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REPOSITORY" = "HelloMrDuan/tianji-private-knowledge"
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')" = "true"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Authenticate real-source witnesses against original pinned bytes
        env:
          TIANJI_REVIEW_DREAM_RAW: ${{ runner.temp }}/zhougong-pinned-original.txt
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            "https://raw.githubusercontent.com/garychowcmu/daizhigev20/4a6d6f2088825f132521d848c2ea86cf9c9a7620/%E6%98%93%E8%97%8F/%E6%9C%AF%E6%95%B0/%E5%91%A8%E5%85%AC%E8%A7%A3%E5%A4%A2.txt" \
            --output "$TIANJI_REVIEW_DREAM_RAW"
          python scripts/verify_external_source_witnesses.py
          python -m unittest discover -s tests -p 'test_external_source_witnesses.py' -v
