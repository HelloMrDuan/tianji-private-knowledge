name: Validate reviewed dream coverage against private knowledge

on:
  push:
    branches:
      - feat/182-dream-domain-acceptance
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/dream-domain-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dream-real-data:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Require private repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REPOSITORY" = "HelloMrDuan/tianji-private-knowledge"
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')" = "true"

      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: HelloMrDuan/tianji-knowledge-base
          ref: 2f6907a6ec10853c998c6afb8204ceef0cb70b3e
          path: public-code
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify real private source and assemble non-Git backend
        run: |
          python - <<'PY'
          import importlib.util, os, shutil, sys
          from pathlib import Path

          private = Path.cwd()
          code = private / "public-code"
          assert not (code / "data").exists()
          spec = importlib.util.spec_from_file_location("source", private / "scripts/import_public_snapshot.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          verified = module.verify(private)
          temp = Path(os.environ["RUNNER_TEMP"])
          snapshot = temp / "reviewed-dream-assets"
          snapshot.mkdir(mode=0o700)
          shutil.copytree(private / "data", snapshot / "data")
          shutil.copy2(private / "private-data-manifest.json", snapshot / "private-data-manifest.json")
          sys.path.insert(0, str(code))
          from scripts.assemble_private_backend import assemble_private_backend
          result = assemble_private_backend(code, snapshot, temp / "private-dream-backend")
          assert result["knowledge_files"] == verified["file_count"]
          print("Verified private knowledge assets:", verified["file_count"])
          PY

      - name: Install real backend dependencies
        run: python -m pip install -e "./public-code[validation,calendar,api]"

      - name: Validate production runtime and all real dream tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-dream-backend"
          export PYTHONPATH=src:tests
          python scripts/build_production_runtime.py
          python -m unittest -v \
            test_dream_combinations \
            test_public_dream_culture_api \
            test_dream_source_review \
            test_phase1_dream \
            test_phase2_private_dream_api
          python - <<'PY'
          from fastapi.testclient import TestClient
          from tianji_kb.api import create_app
          client = TestClient(create_app(admin_read_token="private-review-only"))
          for text, quote in (
              ("梦见一条蛇咬了我的腿", "蛇咬人主得大财"),
              ("梦见我捡到一张钞票", "拾得钱物皆大吉"),
              ("梦见很多鱼在池塘里游来游去", "群鱼游水主有财"),
          ):
              res = client.post("/api/v1/dream/culture", json={"dream_text": text})
              assert res.status_code == 200, res.text
              payload = res.json()
              assert len(payload["matches"]) == 1, payload
              assert payload["matches"][0]["short_quote"] == quote
              assert "canonical_path" not in str(payload)
              assert payload["ai_enabled"] is False
          for text in ("我梦见没被蛇咬", "梦见别人捡到钞票"):
              res = client.post("/api/v1/dream/culture", json={"dream_text": text})
              assert res.status_code == 200
              assert not res.json()["matches"]
          print("Private canonical data -> real public API evidence projection: OK")
          PY
