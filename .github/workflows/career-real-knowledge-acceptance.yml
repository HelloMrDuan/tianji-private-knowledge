name: Validate career Ten-God explanations against real private knowledge

on:
  push:
    branches:
      - feat/185-career-real-knowledge-acceptance
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/career-real-knowledge-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  career-real-data:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Require private repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REPOSITORY" = "HelloMrDuan/tianji-private-knowledge"
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')" = "true"

      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: HelloMrDuan/tianji-knowledge-base
          ref: c2927cb15fee27b3e952ae906fcd9ea05858d547
          path: public-code
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify real private source and assemble non-Git backend
        run: |
          python - <<'PY'
          import importlib.util, os, shutil, sys
          from pathlib import Path

          private = Path.cwd()
          code = private / "public-code"
          assert not (code / "data").exists()
          spec = importlib.util.spec_from_file_location("source", private / "scripts/import_public_snapshot.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          verified = module.verify(private)
          temp = Path(os.environ["RUNNER_TEMP"])
          snapshot = temp / "reviewed-career-assets"
          snapshot.mkdir(mode=0o700)
          shutil.copytree(private / "data", snapshot / "data")
          shutil.copy2(private / "private-data-manifest.json", snapshot / "private-data-manifest.json")
          sys.path.insert(0, str(code))
          from scripts.assemble_private_backend import assemble_private_backend
          result = assemble_private_backend(code, snapshot, temp / "private-career-backend")
          assert result["knowledge_files"] == verified["file_count"]
          print("Verified private knowledge assets:", verified["file_count"])
          PY

      - name: Install real backend dependencies
        run: python -m pip install -e "./public-code[validation,calendar,api]"

      - name: Validate actual career interpretation tests and private product coverage
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/private-career-backend"
          export PYTHONPATH=src:tests
          python scripts/build_production_runtime.py
          python -m unittest -v test_career_interpretation test_scenario_engine
          python scripts/build_product_coverage.py --check
          python - <<'PY'
          from tianji_kb.scenario_engine import execute_scenario
          data = execute_scenario("career", {
              "birth_value": "2000-01-07T12:00:00+08:00",
              "target_year": 2026,
          })
          cards = data["result"]["interpretation_cards"]
          assert len(cards) == 5
          assert all(card["evidence_ids"] for card in cards)
          assert all(card["personal_prediction"] is False for card in cards)
          assert all(set(card["evidence_ids"]) <= set(data["evidence"]) for card in cards)
          print("Real five career interpretation cards passed:", [c["group_id"] for c in cards])
          PY
