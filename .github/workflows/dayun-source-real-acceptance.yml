name: Verify fifth Dayun source excerpt against private original
on:
  pull_request:
    branches: [main]
    paths:
      - "data/research/bazi/dayun_source_collation_v1.json"
      - ".github/workflows/dayun-source-real-acceptance.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canonical-dayun-source:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check private destination
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REPOSITORY" = "HelloMrDuan/tianji-private-knowledge"
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')" = "true"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: HelloMrDuan/tianji-knowledge-base
          ref: c3070254b5953120f5e88ad68821f7691d614a25
          path: public-code
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run private runner guards
        run: python -m unittest discover -s tests -p 'test_accept_product_pr.py' -v
      - name: Install exact candidate
        run: python -m pip install -e "./public-code[validation,calendar,api]"
      - name: Verify isolated source appendix without modifying frozen snapshot
        run: python -m unittest discover -s tests -p 'test_dayun_role_source_appendix.py' -v
      - name: Verify original source bytes, claims and entire regression
        run: |
          python scripts/accept_product_pr.py \
            --public-code "$GITHUB_WORKSPACE/public-code" \
            --expected-sha "c3070254b5953120f5e88ad68821f7691d614a25" \
            --suite all
