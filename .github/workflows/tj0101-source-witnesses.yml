name: TJ-010.1 Verify authentic Bazi source witnesses

on:
  pull_request:
    branches: [main]
    paths:
      - "audits/tj0101_source_witnesses.json"
      - "tests/test_tj0101_source_witnesses.py"
      - ".github/workflows/tj0101-source-witnesses.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-text-witnesses:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check private repository identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REPOSITORY" = "HelloMrDuan/tianji-private-knowledge"
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')" = "true"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify original SHA-256, exact excerpts, branch membership and tamper rejection
        run: python -m unittest discover -s tests -p 'test_tj0101_source_witnesses.py' -v
