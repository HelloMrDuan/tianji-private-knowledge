name: Verify merged main full private regression

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/accept_product_pr.py"
      - ".github/workflows/merged-main-real-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combined-main:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Confirm real private destination
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REPOSITORY" = "HelloMrDuan/tianji-private-knowledge"
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')" = "true"

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: HelloMrDuan/tianji-knowledge-base
          ref: 7dfcfa121d4c5cce29db8692bc566b97385f17f9
          path: public-code
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run isolated runner guards
        run: python -m unittest discover -s tests -p 'test_accept_product_pr.py' -v

      - name: Install merged real code dependencies
        run: python -m pip install -e "./public-code[validation,calendar,api]"

      - name: Verify original Canonical and entire merged runtime regression
        env:
          TIANJI_PUBLIC_CHECKOUT: ${{ github.workspace }}/public-code
        run: |
          python scripts/accept_product_pr.py \
            --public-code "$GITHUB_WORKSPACE/public-code" \
            --expected-sha 7dfcfa121d4c5cce29db8692bc566b97385f17f9 \
            --suite all
