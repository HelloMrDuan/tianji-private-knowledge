# Both images are built from verified private Actions; neither is published
# automatically. Supply local/private-registry tags through environment.
name: tianji

services:
  tianji-api:
    image: ${TIANJI_PRIVATE_API_IMAGE:?Set the private sealed backend image tag}
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=32m
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 30s
      timeout: 7s
      retries: 3
      start_period: 20s
    networks: ["tianji-private-net"]

  tianji-web:
    image: ${TIANJI_PUBLIC_WEB_IMAGE:?Set the static web image tag}
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=16m
      - /var/cache/nginx:rw,nosuid,noexec,size=16m
    ports:
      - "127.0.0.1:${TIANJI_HOST_PORT:-8080}:8080"
    depends_on:
      tianji-api:
        condition: service_healthy
    networks: ["tianji-private-net"]

networks:
  tianji-private-net:
    driver: bridge
