server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    # Never expose internal knowledge/admin endpoints or source-like paths.
    location = /api/v1/admin { return 404; }
    location ^~ /api/v1/admin/ { return 404; }
    location ^~ /data/ { return 404; }
    location ^~ /build/ { return 404; }
    location ^~ /config/ { return 404; }
    location ^~ /schemas/ { return 404; }
    location ^~ /.git { return 404; }
    location ^~ /.env { return 404; }

    location /api/ {
        proxy_pass http://tianji-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass http://tianji-api:8000/health;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
